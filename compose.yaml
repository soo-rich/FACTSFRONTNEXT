services:
  front:
    container_name: facts-front
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Toute la configuration est lue au démarrage du conteneur : la même image
    # sert tous les environnements. Les valeurs proviennent du .env du dépôt ou
    # des variables du shell.
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?APP_URL est requis}
      API_URL: ${API_URL:?API_URL est requis}
      NEXTAUTH_BASEPATH: ${NEXTAUTH_BASEPATH:-/api/auth}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL est requis}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET est requis}
    ports:
      - '5000:3000'
